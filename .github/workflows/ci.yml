name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cwork
          POSTGRES_PASSWORD: cwork
          POSTGRES_DB: cwork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cwork"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cwork:cwork@localhost:5432/cwork_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-that-is-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-chars
      FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prisma migrate deploy

      # Guards against a generated Prisma migration silently dropping the
      # hand-written indexes, constraints and append-only triggers.
      - name: Verify hand-written database objects
        run: npm run db:verify

      - run: npm test

      # Black-box run against the real application: auth, RBAC row scoping,
      # the leave ledger, idempotent punch replay, the payroll lifecycle with
      # its separation of duties, and the append-only audit trail. Migrates,
      # truncates and seeds the database itself.
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgresql://cwork:cwork@localhost:5432/cwork_test?schema=public

      - run: npm run build

  web:
    name: Web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --line-length 100 --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
