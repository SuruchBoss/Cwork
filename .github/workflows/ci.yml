name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisories are published against code that has not changed, so the audit
  # below has to run on a clock as well as on a commit. Monday 03:00 UTC is
  # Monday morning in Bangkok.
  schedule:
    - cron: '0 3 * * 1'

# A new push supersedes an in-flight run for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cwork
          POSTGRES_PASSWORD: cwork
          POSTGRES_DB: cwork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cwork"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cwork:cwork@localhost:5432/cwork_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-that-is-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-chars
      FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint

      # Nothing else exercises docker-compose.yml, so a service can quietly
      # stop being able to boot the code it is documented to run.
      - name: Compose services can boot what they are documented to run
        run: npm run verify:compose

      - run: npx prisma migrate deploy

      # Guards against a generated Prisma migration silently dropping the
      # hand-written indexes, constraints and append-only triggers.
      - name: Verify hand-written database objects
        run: npm run db:verify

      # `migrate deploy` above proves the migrations run on an EMPTY database.
      # This proves the database they build is the one schema.prisma describes:
      # a model changed without a migration would otherwise only surface as a
      # failing query in production, never in CI.
      - name: Migrations and schema.prisma have not drifted apart
        run: npm run verify:migrations

      # Unset, deliberately: the unit tests must pass on a clean clone, and this
      # job's env block would otherwise hide a file that reads process.env at
      # import time. That is exactly what happened — naming APP_CONFIG pulled in
      # AppConfigModule, whose decorator validated the environment on load, so
      # `git clone && npm ci && npm test` failed on a suite that touches neither
      # a database nor a config. CI was green throughout.
      # ADR-0003 calls tenant scoping "greppable" — nobody was grepping. This
      # refuses to let a raw statement exist that has not been read and
      # classified; it cannot prove a WHERE clause is right, and says so.
      - name: Every raw SQL statement has been classified
        run: npm run verify:sql

      - name: Unit tests, with the environment a fresh clone has
        run: env -u DATABASE_URL -u JWT_ACCESS_SECRET -u JWT_REFRESH_SECRET -u FIELD_ENCRYPTION_KEY npm test

      # Black-box run against the real application: auth, RBAC row scoping,
      # the leave ledger, idempotent punch replay, the payroll lifecycle with
      # its separation of duties, and the append-only audit trail. Migrates,
      # truncates and seeds the database itself.
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgresql://cwork:cwork@localhost:5432/cwork_test?schema=public

      # Counts in prose are the one claim nothing else checks, which is how
      # "271 backend tests" ended up standing for two different figures in six
      # documents. Runs last: it measures the suites, so they should pass first.
      - name: The documented test counts match the suites
        run: npm run verify:docs

      - run: npm run build

  upgrade:
    name: Upgrade from the previous release
    runs-on: ubuntu-latest

    # The Backend job proves the migrations apply to an EMPTY database. That
    # says nothing about an existing installation: a migration that adds a NOT
    # NULL column with no default, or drops a column that still holds data, runs
    # fine on empty tables and destroys a real deployment. This job seeds a
    # database at the previous release and migrates it up to this commit, so a
    # data-losing migration fails here instead of in someone's production. (CW-032)

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cwork
          POSTGRES_PASSWORD: cwork
          POSTGRES_DB: cwork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cwork"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cwork:cwork@localhost:5432/cwork_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-that-is-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-chars
      FIELD_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test

    steps:
      # Full history so the previous release tag and its tree are available.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Check out the most recent release into a worktree, install it, and let
      # its own migrations and seed populate the database — real data written by
      # the code that shipped, not a fixture that drifts from the schema.
      - name: Seed a database at the previous release
        run: |
          PREV="$(git describe --tags --abbrev=0)"
          echo "Upgrading from $PREV"
          git worktree add --detach "$RUNNER_TEMP/previous" "$PREV"
          cd "$RUNNER_TEMP/previous/backend"
          npm ci
          npx prisma migrate deploy
          npx prisma generate
          npx ts-node --transpile-only prisma/seed.ts

      # Apply the migrations added since that release ON TOP of the populated
      # database, then read the seed back through this commit's Prisma client.
      # check-upgraded-data.ts fails if a migration dropped a column the current
      # code still reads, or did not apply cleanly on non-empty tables.
      - name: Migrate the populated database up to this commit
        working-directory: backend
        run: |
          npm ci
          npx prisma migrate deploy
          npx prisma generate
          npx ts-node --transpile-only scripts/check-upgraded-data.ts

  web:
    name: Web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --line-length 100 --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test

  landing:
    name: Landing page
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pages.yml checks this too, but only when it deploys — which is only on
      # a push to main that touches landing/. A pull request editing the Thai
      # page and forgetting to regenerate the English one would go green.
      - name: The English page is regenerated from the Thai one
        run: |
          node landing/build-en.mjs
          git diff --exit-code -- landing/en/index.html

  security:
    name: Dependency advisories
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Shipped dependencies only. A dev-only advisory is worth knowing about
      # but is not a reason to block a release, and treating the two alike is
      # how an audit gate ends up permanently muted.
      #
      # This job can go red without anybody pushing anything: that is the
      # point. When it does, the fix is a real one — upgrade the parent, or
      # pin the fixed transitive version through `overrides` in package.json
      # and say in the commit message what bounds the exposure meanwhile.
      - name: Backend production dependencies
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npm run audit:prod

      - name: Web production dependencies
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run audit:prod

  dco:
    name: Sign-off
    # Pull requests only: the check is about what a contribution carries, and a
    # push to main is not a contribution being offered.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole range between base and head has to be readable, and the
          # default shallow clone gives one commit.
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Merge commits are skipped: merging main into a branch is not the
          # contributor certifying anything, and asking them to sign it would
          # teach people to sign reflexively.
          missing=$(
            git log --no-merges --format='%H' "$BASE..$HEAD" | while read -r sha; do
              if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -q '[^[:space:]]'; then
                printf '  %s %s\n' "$(git rev-parse --short "$sha")" "$(git log -1 --format=%s "$sha")"
              fi
            done
          )

          if [ -n "$missing" ]; then
            echo "These commits have no Signed-off-by line:"
            echo "$missing"
            echo
            echo "Sign-off certifies you have the right to submit the change —"
            echo "see CONTRIBUTING.md#signing-off-your-work and the DCO file."
            echo
            echo "To fix the most recent commit:"
            echo "    git commit --amend -s && git push --force-with-lease"
            echo
            echo "To fix every commit on this branch:"
            echo "    git rebase --signoff origin/main && git push --force-with-lease"
            exit 1
          fi

          echo "Every commit in this pull request is signed off."
