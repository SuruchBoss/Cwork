name: Landing page

# Publishes landing/ to https://suruchboss.github.io/Cwork/.
#
# The page references its assets relatively, so it works unchanged under the
# repository subpath. Nothing else in the repository is published: the artifact
# is the landing directory and only the landing directory.

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight — a half-finished
# deployment would take the page down rather than leave the last one up.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # Pages has to be switched on once, by hand, under
      # Settings → Pages → Build and deployment → Source: GitHub Actions.
      # `enablement: true` asks the API to do it instead, but GITHUB_TOKEN is
      # refused ("Resource not accessible by integration") on a repository that
      # has never had Pages, so the first run fails until somebody flips it.
      # It is kept because it makes every later run a no-op rather than a
      # second thing to remember if Pages is ever turned off again.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # landing/en/index.html is generated from landing/index.html. If the two
      # are out of step the English page is quietly stale, so this blocks the
      # deploy rather than publishing it.
      - name: The English page is up to date with the Thai one
        run: |
          node landing/build-en.mjs
          git diff --exit-code -- landing/en/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing

      - id: deploy
        uses: actions/deploy-pages@v4
