<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  The 1280x640 card shown when a Cwork link is pasted into LINE, Facebook,
  LinkedIn, Slack or X — GitHub's social preview for the repository, and the
  og:image of both landing pages. Rendered by build.mjs; do not edit the PNGs.
  `#th` renders the Thai card for the Thai landing page.

  Two constraints shaped it. It is often shown at about a third of this size,
  so exactly one thing may be large and everything else has to survive being
  small. And the page title is printed underneath it, so repeating the title
  here would waste the only picture anyone sees.

  Deliberately no test counts or version numbers: a figure baked into a PNG is
  the one claim `verify:docs` cannot read, and stale numbers on a shared image
  are worse than none.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&text=%E4%BA%BA%E4%BA%8B&display=swap">
<style>
  /* The landing page's palette — washi, sumi, indigo and a vermilion seal — so
     a link preview and the site it points at are recognisably one product. */
  :root {
    --paper: #f6f4ee;
    --ink:   #17181c;
    --ink-2: #45474f;
    --line:  #d6d1c3;
    --grid:  rgb(23 24 28 / .05);
    --shu:   #cf3b24;
    --ai:    #1d3d6e;
  }

  * { box-sizing: border-box; margin: 0; }

  body {
    width: 1280px; height: 640px; overflow: hidden; position: relative;
    display: flex; align-items: stretch;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--ink);
    font-family: "IBM Plex Sans Thai", system-ui, sans-serif;
  }

  .say {
    flex: none; width: 640px;
    padding: 64px 0 60px 72px;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  .brand { display: flex; align-items: center; gap: 16px; }
  .hanko {
    width: 54px; height: 54px; flex: none; border-radius: 7px;
    background: var(--shu); color: #fff;
    display: grid; place-items: center;
    font-family: "JetBrains Mono", monospace; font-size: 1.1rem; font-weight: 500;
    box-shadow: inset 0 0 0 3px rgb(255 255 255 / .18);
  }
  .brand b { font-family: "Anuphan", sans-serif; font-weight: 700; font-size: 2.15rem; letter-spacing: -.02em; }

  h1 {
    font-family: "Anuphan", sans-serif; font-weight: 700;
    font-size: 4.1rem; line-height: 1.14; letter-spacing: -.025em;
  }
  h1 span { display: block; }
  h1 em { font-style: normal; color: var(--shu); }

  .sub { margin-top: 22px; font-size: 1.3rem; line-height: 1.55; color: var(--ink-2); max-width: 30ch; }

  .stack {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    font-family: "JetBrains Mono", monospace; font-size: .9rem; letter-spacing: .04em;
    color: var(--ink-2);
  }
  .stack .lic { color: var(--shu); }
  .dot { width: 4px; height: 4px; background: var(--line); flex: none; }

  /* 人事 (jinji, HR) as a signboard between the words and the product. */
  .tate {
    position: absolute; left: 640px; top: 64px;
    writing-mode: vertical-rl; font-family: "Shippori Mincho B1", serif; font-weight: 800;
    font-size: 4.4rem; line-height: 1; letter-spacing: .18em;
    color: transparent; -webkit-text-stroke: 1.4px var(--shu);
  }

  /* The product itself, running — bled off two edges so it reads as a window
     onto something larger, with a printer's crop mark at its corner. */
  .shot { flex: 1; position: relative; overflow: hidden; }
  .shot img {
    position: absolute; top: 118px; left: 110px;
    width: 780px; height: auto;
    border: 1px solid var(--line); border-right: 0; border-bottom: 0;
    border-radius: 8px 0 0 0;
    box-shadow: -30px 30px 70px -30px rgb(23 24 28 / .45);
  }
  .shot i { position: absolute; top: 104px; left: 96px; width: 20px; height: 20px; border-top: 2px solid var(--shu); border-left: 2px solid var(--shu); }
</style>
</head>
<body>
  <div class="say">
    <div class="brand">
      <span class="hanko">CW</span>
      <b>Cwork</b>
    </div>

    <div>
      <h1 data-en='<span>All of HR,</span><span>no <em>per-seat</em> fee</span>'
          data-th='<span>งาน HR ทั้งบริษัท</span><span>ไม่ต้องจ่าย<em>รายหัว</em></span>'></h1>
      <p class="sub" data-en="Thai payroll, attendance that is hard to fake, approvals from a phone — on your own server."
         data-th="เงินเดือนตามกฎหมายไทย ลงเวลาที่โกงยาก อนุมัติจากมือถือ — บนเซิร์ฟเวอร์ของคุณเอง"></p>
    </div>

    <div class="stack">
      <span class="lic">Apache-2.0</span><span class="dot"></span>
      <span>Self-hosted</span><span class="dot"></span>
      <span>PostgreSQL</span><span class="dot"></span>
      <span>TH · EN</span>
    </div>
  </div>

  <span class="tate" aria-hidden="true">人事</span>

  <div class="shot">
    <i></i>
    <img data-en="../../landing/assets/shots/dashboard.en.webp"
         data-th="../../landing/assets/shots/dashboard.th.webp"
         alt="The Cwork dashboard, showing pending approvals, headcount and the latest payroll run">
  </div>

  <script>
    // One card, two languages: the Thai landing page shares the Thai one.
    var lang = location.hash === '#th' ? 'th' : 'en';
    document.documentElement.lang = lang;
    document.querySelector('h1').innerHTML = document.querySelector('h1').dataset[lang];
    var sub = document.querySelector('.sub');
    sub.textContent = sub.dataset[lang];
    var img = document.querySelector('.shot img');
    img.src = img.dataset[lang];
  </script>
</body>
</html>
