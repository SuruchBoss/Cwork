# Security headers for every response the console serves.
#
# Kept in one file, and re-included by every `location` that sets a header of
# its own, because of an nginx footgun: `add_header` directives are inherited
# from an outer scope ONLY when the inner block declares no `add_header` of its
# own. A `location` that adds, say, a `Cache-Control` header therefore silently
# drops all of these — the page goes out with no CSP and no X-Frame-Options.
# Defining them once and `include`-ing them wherever a header is added keeps a
# future edit from leaving one location behind.
#
# The CSP is deliberately strict: the console loads no third-party scripts, so
# nothing here should need relaxing.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
