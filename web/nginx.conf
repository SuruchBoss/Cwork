server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. Defined once in security-headers.conf and re-included in
    # every location that sets a header of its own — nginx drops inherited
    # add_header directives from any block that declares its own, so a location
    # that only means to set Cache-Control would otherwise serve the page with
    # no CSP and no X-Frame-Options.
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # index.html must never be cached, or a deploy strands clients on old chunks.
    # This location also serves every SPA deep link, via the try_files below.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: every unknown path renders the app, which routes client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
