# Cwork — full stack for local development and small self-hosted deployments.
#
#   cp .env.example .env    # then fill in the secrets it asks for
#   docker compose up -d --build
#   docker compose run --rm --build migrate                    # apply migrations
#   docker compose run --rm migrate npm run db:seed            # demo data; skip in production
#
# The web console is then at http://localhost:8080.
#
# Migrations run through the `migrate` service, not `exec api`: the api image is
# pruned to production dependencies and deliberately ships no Prisma CLI.
#
# The interactive API docs at http://localhost:3000/api/docs are only mounted
# when NODE_ENV is not `production`, which is the default here. Set
# NODE_ENV=development in .env if you want them.

name: cwork

services:
  postgres:
    # pgvector is only needed for optional semantic search; the plain postgres:16
    # image works for everything else.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cwork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cwork}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cwork} -d ${POSTGRES_DB:-cwork}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published by default: the database should not be reachable from
    # outside the compose network. Uncomment for local psql access.
    # ports:
    #   - "5432:5432"

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cwork}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cwork}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Bangkok}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-THB}
      # Set to `postgres` when running more than one api replica, or each one
      # hands out the full budget on its own.
      THROTTLE_STORAGE: ${THROTTLE_STORAGE:-memory}
      # Scheduled jobs need no such switch: each one takes a Postgres advisory
      # lock, so replicas beyond the first stand down. This only bounds how long
      # one may hold it.
      JOB_LOCK_TIMEOUT_MS: ${JOB_LOCK_TIMEOUT_MS:-900000}
      # The outbox relay. Every replica polls; the claim uses FOR UPDATE SKIP
      # LOCKED, so they share the queue rather than duplicate it.
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-5000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
      OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-14}
      # Notification delivery. Off until a relay is configured; the API says
      # which mode it is in at every boot.
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-no-reply@cwork.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Cwork}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_CLIENT_EMAIL: ${FCM_CLIENT_EMAIL:-}
      FCM_PRIVATE_KEY: ${FCM_PRIVATE_KEY:-}
      MALWARE_SCAN_ENABLED: ${MALWARE_SCAN_ENABLED:-false}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-15000}
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-none}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-sonnet-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - api-uploads:/app/uploads

  # Malware scanning for uploads. Behind a profile because the image carries a
  # signature database and is a heavy thing to pull for an evaluation:
  #
  #   docker compose --profile av up -d clamav
  #
  # then set MALWARE_SCAN_ENABLED=true and CLAMAV_HOST=clamav in .env. Until
  # then the API logs, at every boot, that uploads are not being scanned.
  clamav:
    profiles: ["av"]
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      # Signature downloads are slow; keeping them survives a restart.
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s

  # One-off tools container: migrations, the demo seed, `db:verify`. Built from
  # the Dockerfile's `build` stage, which keeps the devDependencies the runtime
  # image prunes away. Under a profile so `docker compose up` never starts it;
  # `docker compose run` enables the profile on its own.
  migrate:
    profiles: ["tools"]
    build:
      context: ./backend
      target: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-cwork}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cwork}?schema=public
      # The seed writes encrypted columns, so it needs the same key as the API.
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in .env}
      # `prisma migrate deploy` needs neither of these, but the two commands
      # this service is documented to run — `db:seed`, which drives the real
      # services to give the demo company a history, and `db:init`, which
      # creates the first organisation — both boot Nest, and Nest validates the
      # whole environment before any module starts. Without them the seed stops
      # half way and `db:init` never runs at all.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  web:
    build:
      context: ./web
      args:
        # Same-origin: nginx proxies /api to the api service.
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  postgres-data:
  api-uploads:
  clamav-db:
