name: cwork
description: Cwork — employee mobile app (clock in/out, leave, payslips, HR assistant).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management. Riverpod without code generation on purpose: one less
  # build step for contributors, and the providers here are simple enough that
  # the generator would not earn its keep.
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Storage — tokens go in the platform keystore, never in SharedPreferences.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Device + location, for clock in/out
  geolocator: ^13.0.2
  device_info_plus: ^11.1.1
  package_info_plus: ^8.1.1

  # Routing & UI
  go_router: ^14.6.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
